<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - FlashFile</title>
    <script>
        const path = window.location.pathname;
        const search = window.location.search;
        if (path.includes('/dl') || path.includes('/f/')) {
            window.location.replace('/dl/' + search);
        } else {
            window.location.replace('/' + search);
        }
    </script>
</head>
<body style="background:#090a0f; color:#fff; font-family:sans-serif; text-align:center; padding:50px;">
    <h2>⚡ Redirecting to FlashFile...</h2>
</body>
</html>
