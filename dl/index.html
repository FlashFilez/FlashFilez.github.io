<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="../favicon.svg">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Downloading File - FlashFile</title>
    
    <!-- Modern UI Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #090a0f;
            --bg-card: rgba(22, 25, 38, 0.9);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent: #ff3b5c;
            --accent-gradient: linear-gradient(135deg, #ff3b5c 0%, #e02447 100%);
            --accent-glow: rgba(255, 59, 92, 0.32);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-display: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .ambient {
            position: absolute;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 540px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 22px;
            padding: 2.75rem 2.25rem;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .icon-badge {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: rgba(255, 59, 92, 0.1);
            border: 1px solid rgba(255, 59, 92, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            margin-bottom: 1.35rem;
            box-shadow: 0 8px 24px var(--accent-glow);
            position: relative;
            animation: pulseRing 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        .icon-badge svg {
            width: 32px;
            height: 32px;
            stroke-width: 2.2;
            color: var(--accent);
        }
        @keyframes pulseRing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        h1 {
            font-family: var(--font-display);
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .filename-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin: 1.25rem 0 1.5rem 0;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: #e2e8f0;
            word-break: break-all;
            line-height: 1.4;
        }
        .status-msg {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }
        .btn-direct {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            background: var(--accent-gradient);
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
            filter: brightness(1.08);
        }
        .btn-direct svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
        }
        .footer-note {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            color: #64748b;
        }
        .footer-note a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .footer-note a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="ambient"></div>
    <div class="container">
        <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </div>
        
        <h1>Fast Download</h1>
        
        <div class="filename-box" id="fileNameBox">
            Preparing your download...
        </div>
        
        <p class="status-msg" id="countdownText">
            Your high-speed download will begin automatically in <span id="secCount" style="color: var(--accent); font-weight: 600;">2</span> seconds...
        </p>
        
        <a id="directLink" href="#" class="btn-direct">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Click here if download doesn't start
        </a>
        
        <div class="footer-note">
            Powered by <a href="https://t.me/flashfilezbot" target="_blank">@flashfilezbot</a> • Wire-speed & resumable
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const hash = params.get('id') || params.get('hash') || '';
        const rawFileName = params.get('file') || params.get('name') || '';
        const fileName = rawFileName ? decodeURIComponent(rawFileName) : 'download';
        const backendHost = "https://Jishnupg-FileToLink.hf.space";

        let src = "";
        if (hash) {
            src = `${backendHost}/f/${hash}/${encodeURIComponent(fileName)}`;
        } else if (params.get('src')) {
            src = params.get('src');
        }

        const fileNameBox = document.getElementById('fileNameBox');
        const directLink = document.getElementById('directLink');
        const pageTitle = document.getElementById('pageTitle');
        const secCount = document.getElementById('secCount');

        if (src) {
            fileNameBox.textContent = fileName;
            directLink.href = src;
            directLink.setAttribute('download', fileName);
            pageTitle.textContent = `Downloading ${fileName} - FlashFile`;

            let timeLeft = 2;
            const timer = setInterval(() => {
                timeLeft--;
                if (secCount) secCount.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    window.location.href = src;
                }
            }, 1000);
        } else {
            fileNameBox.textContent = "No file specified. Please use the download link from Telegram.";
            directLink.style.display = "none";
            document.getElementById('countdownText').textContent = "Invalid or expired link.";
        }
    </script>
</body>
</html>
